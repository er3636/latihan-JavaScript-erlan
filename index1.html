<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h2>program hitungan umur</h2>
    <label for="tahun">masukan taun lahir:</label>
    <input type="number" id="tahun" placeholder="contoh: 2000">
    <button onclick="hitunganUmur()">hitung</button>

    <p id="hasil"></p>

    <script> 
         function hitunganUmur()  {
            let tahunlahir = document.getElementById("tahun").value;
            let tahunsekarang = new Date().getFullYear();
            let umur = tahunsekarang - tahunlahir;

            if (tahunlahir === "") {
                alert("tahun lahir tidak boleh kosong!");
                return;
            }
            if (tahunlahir > tahunsekarang) {
                alert("tahunlahirtidak boleh lebih dari tahun sekarang!");
                return;
            }
            

            document.getElementById("hasil").innerHTML =
                "Umur kamu sekarng adalah " + umur + " tahun.";
         }
        
    </script>
</body>
</html>
